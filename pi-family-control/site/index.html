<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="cache-control" content="no-cache"><title>ラズパイ制御</title><link rel="stylesheet" href="/style.css?v=2"></head><body><main>
<header><div><small>FAMILY DEVICE CONTROL</small><h1>ラズパイ制御システム</h1></div><span id="status">接続確認中</span></header>
<section id="auth" class="card"><h2 id="authTitle">ログイン</h2><p id="authHint">管理パスワードを入力してください。</p><form id="authForm"><input id="password" type="password" minlength="10" placeholder="10文字以上のパスワード" required><button id="authButton">ログイン</button></form><p id="authError" class="error"></p></section>
<div id="dashboard" hidden>
<div class="buttons"><button id="refresh" class="muted">更新</button><button id="logout" class="muted">ログアウト</button></div>
<section class="card"><h2>リモート操作</h2><p id="lockStatus"></p><div class="buttons"><button id="lock" class="red">今すぐロック</button><button id="unlock" class="green">ロック解除</button><button id="extend" class="muted">今日だけ延長</button></div></section>
<section class="card"><h2>利用時間の設定</h2><form id="settings"><label class="inline"><input id="scheduleEnabled" type="checkbox">曜日別の時間割を有効にする</label><div class="scroll"><table><thead><tr><th>曜日</th><th>有効</th><th>開始</th><th>終了</th></tr></thead><tbody id="days"></tbody></table></div><div class="grid"><label class="inline"><input id="noLimit" type="checkbox">1日の使用時間を無制限にする</label><label>1日の上限（分）<input id="limit" type="number" min="1" max="1440" value="120"></label><label>今日の延長分数<input id="extension" type="number" min="1" max="240" value="15"></label></div><button>設定を保存</button><p id="saveMsg"></p></form></section>
<section class="card"><h2>使用履歴</h2><p>今日：<b id="todayUsage">—</b></p><div class="scroll"><table><thead><tr><th>日付</th><th>使用時間</th></tr></thead><tbody id="usage"></tbody></table></div></section>
<section class="card"><h2>パスワード変更</h2><form id="changePass" class="grid"><label>現在のパスワード<input id="current" type="password" required></label><label>新しいパスワード<input id="new" type="password" minlength="10" required></label><button>変更</button><p id="passMsg"></p></form></section>
</div><footer>Raspberry Pi 5 · 日本時間</footer></main><script src="/app.js?v=2" defer></script></body></html>
